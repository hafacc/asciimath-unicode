[package]
name = "keyboard-core"
version = "0.1.0"
edition = "2024"
description = "the Swift binding for asciimath-unicode"
repository = "https://github.com/hafacc/asciimath-unicode"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
asciimath-unicode = "0.6.0"
emojis = "0.9"
unicode-segmentation = "1.13.3"

[dev-dependencies]
convert = { path = "../extension" }
