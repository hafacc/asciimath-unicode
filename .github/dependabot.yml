version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      - { dependency-name: typescript, versions: ["7.0.x"] }
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # these must match the version the windows crate uses, which is still 0.62
    ignore:
      - { dependency-name: windows-core, versions: [">= 0.100"] }
      - { dependency-name: windows-registry, versions: [">= 0.100"] }
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
